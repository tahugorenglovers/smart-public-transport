# Mosquitto config — Smart Public Transport
# Local dev: port 1883 (docker-compose exposes as 1883)
# Dosen server: port 1813 (as allocated)
# The host port is set in docker-compose.yml port mapping.
# This config always listens on container port 1883 internally;
# docker-compose maps it to 1883 (local) or 1813 (server).

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
